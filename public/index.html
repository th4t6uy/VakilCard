<!doctype html>
<html lang="en">
  <head>
    <!-- 2026-09-12: the subdomain root now just serves the signed-in app (www/vakilcard is the public marketing page). Keep it out of the index so it never competes with that page. -->
    <meta name="robots" content="noindex, follow" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141f3a" />
    <meta name="description" content="VakilCard — the digital chamber card and canonical Vakilpedia onboarding gateway with WhatsApp phone verification." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- ONE icon convention across the estate, at /icons/. The path is new on
         purpose: browsers key cached favicons by URL and ignore cache headers
         for them, so reusing an old path leaves every tab that ever loaded the
         old mark still showing it. This app had no favicon link at all. -->
    <link rel="icon" href="%PUBLIC_URL%/icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="VakilCard" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>VakilCard</title>
    <!-- Blocking theme-init, matching every other Vakilpedia app
         (CaseLinx/CourtQue/SignLinx/Affidavit Maker/Account, 2026-09-16).
         Runs before this page paints, so there is never a flash of the
         wrong theme. Day/night is only the DEFAULT before the visitor's
         first explicit toggle -- once vp-theme-explicit is set, this never
         overrides their choice again. -->
    <script>
    (function () {
      try {
        var saved = localStorage.getItem("vp-theme");
        var explicit = localStorage.getItem("vp-theme-explicit");
        if (explicit === "1" && (saved === "light" || saved === "dark")) {
          document.documentElement.setAttribute("data-theme", saved);
          return;
        }
        var hour = new Date().getHours();
        var isNight = hour >= 18 || hour < 6;
        document.documentElement.setAttribute("data-theme", isNight ? "dark" : "light");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
